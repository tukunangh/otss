[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OTSS Team"]
license = "MIT"
repository = "https://github.com/otss/otss"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
rust_decimal = { version = "1.35", features = ["mathops", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Internal crates
otss-core = { path = "crates/elizabeth-core" }
otss-devops = { path = "crates/nathan-devops" }
otss-data = { path = "crates/mia-data" }
otss-integration = { path = "crates/david-integration" }
otss-qa = { path = "crates/daniel-qa" }
otss-pm = { path = "crates/sophia-pm" }
